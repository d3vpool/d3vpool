name: Update profile stat cards

on:
  schedule:
    # Runs once a day at 05:30 UTC. Adjust to taste.
    - cron: "30 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  update-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate SVGs
        env:
          # A Personal Access Token with `repo` + `read:user` scopes, added
          # as a repo secret named GH_TOKEN. The default GITHUB_TOKEN cannot
          # read contributionsCollection / cross-repo stats, so a PAT is
          # required here.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: python3 generate_svg.py

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg .loc_cache.json
          git diff --quiet --cached || git commit -m "chore: refresh profile stat cards"
          git push
